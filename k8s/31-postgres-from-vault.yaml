# Vault doit joindre Postgres pour créer, renouveler et supprimer les utilisateurs éphémères.
# Sans cette règle, le refus global du namespace app bloque sa connexion.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-vault
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres     # s'applique au pod Postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:               # depuis le namespace vault…
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:                     # …et uniquement le pod Vault
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 5432
