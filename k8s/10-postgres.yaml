# Service "headless" (sans IP propre) : le nom "postgres" pointe directement vers le pod.
# Un StatefulSet en a besoin pour donner une identité réseau stable à son pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: app
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: app
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false   # Postgres n'a pas besoin de parler à l'API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # l'utilisateur "postgres" de l'image officielle
        runAsGroup: 999
        fsGroup: 999            # permet de lire les fichiers du Secret monté (mode 0440)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: app
            # Identifiants lus dans des fichiers, pas dans des variables d'environnement
            - name: POSTGRES_USER_FILE
              value: /var/run/secrets/db/username
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/secrets/db/password
            # Sous-dossier : Postgres le crée lui-même avec les bons droits
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-credentials
              mountPath: /var/run/secrets/db
              readOnly: true
            # Seuls dossiers inscriptibles hors des données : le socket et /tmp
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-credentials
          secret:
            secretName: postgres-credentials
            defaultMode: 0440
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
