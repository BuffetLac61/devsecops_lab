# Compte dédié à l'app, sans token monté : l'app n'a aucun droit sur l'API Kubernetes.
# En mode projected-SA, c'est l'injecteur qui demande à Kubernetes un jeton pour ce compte.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        vault-db-injector: "true"          # sans ce label, l'injecteur ignore le pod
      annotations:
        db-creds-injector.numberly.io/cluster: database                 # montage du moteur database
        db-creds-injector.numberly.io/pg.role: app-readonly             # rôle Vault à utiliser
        db-creds-injector.numberly.io/pg.mode: classic                  # deux variables : utilisateur et mot de passe
        db-creds-injector.numberly.io/pg.env-key-dbuser: DB_USER        # lue par read_setting() dans main.py
        db-creds-injector.numberly.io/pg.env-key-dbpassword: DB_PASSWORD
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.gitlab.com/buffetlac61-group/devsecops_lab/app:ef3a4dfa
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: app
            # DB_USER et DB_PASSWORD ne sont plus définis ici : vault-db-injector les injecte.
            # Le Secret statique postgres-credentials n'est plus monté dans l'app.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: app
spec:
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 8000
      targetPort: http
